<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Sprint - Juego de Matematicas</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Cambiar tema">
                    Modo oscuro
                </button>
            </div>
            <div class="title">Math Sprint</div>
            <div class="subtitle">Responde rapido, haz rachas y supera tu mejor marca</div>
        </div>

        <div class="score-board">
            <div class="score-item">
                <div class="score-label">Puntuacion</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Correctas</div>
                <div class="score-value correct-color" id="correct">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Incorrectas</div>
                <div class="score-value incorrect-color" id="incorrect">0</div>
            </div>
            <div class="score-item">
                <div class="score-label">Mejor Puntuacion</div>
                <div class="score-value best-color" id="bestScore">0</div>
            </div>
        </div>

        <div class="difficulty-selector">
            <label class="difficulty-label">Selecciona dificultad:</label>
            <div class="difficulty-buttons">
                <button class="difficulty-btn active" data-difficulty="easy">Facil</button>
                <button class="difficulty-btn" data-difficulty="medium">Medio</button>
                <button class="difficulty-btn" data-difficulty="hard">Dificil</button>
            </div>
        </div>

        <div class="game-meta">
            <div class="meta-row">
                <span id="timerLabel">Tiempo: 12s</span>
                <span id="progressLabel">Pregunta 1 de 20</span>
            </div>
            <div class="timer-track">
                <div class="timer-bar" id="timerBar"></div>
            </div>
        </div>

        <div class="game-area">
            <div class="feedback empty-feedback" id="feedback"></div>
            <div class="question" id="question">5 + 3</div>
            <div class="input-group">
                <input
                    type="number"
                    id="answer"
                    placeholder="Tu respuesta"
                    autocomplete="off"
                >
            </div>
            <div class="buttons-group">
                <button class="btn-submit" id="submitBtn">Responder</button>
                <button class="btn-skip" id="skipBtn">Saltar</button>
                <button class="btn-reset" id="resetBtn">Nuevo juego</button>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-label">Racha</div>
                    <div class="stat-value" id="streak">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Preguntas</div>
                    <div class="stat-value" id="attempts">0</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Multiplicador</div>
                    <div class="stat-value" id="multiplier">x1</div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/game.js" defer></script>
</body>
</html>
